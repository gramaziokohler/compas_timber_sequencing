name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core / python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rhino 8 ships Python 3.9, so it stays. ubuntu-latest (26.04) has no 3.9 build;
          # windows-latest does, which is also how compas_timber covers 3.9.
          - {os: windows-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Without compas_timber, conftest.py skips the adapter and tests/timber.
      - run: pytest

  timber:
    name: timber / python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[timber,dev]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
